<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" preserveAspectRatio="xMidYMid meet" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="1" stop-color="#0d1624"/>
    </linearGradient>
    <linearGradient id="ttl" gradientUnits="userSpaceOnUse" x1="370" y1="0" x2="560" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#3ddc84"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="380 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" fill-opacity="0.025"/>
    </pattern>
    <clipPath id="c1"><rect x="388" y="176" height="20" width="0"><animate attributeName="width" values="0;0;480;480" keyTimes="0;0.025;0.075;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c2"><rect x="388" y="198" height="20" width="0"><animate attributeName="width" values="0;0;480;480" keyTimes="0;0.15;0.2;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c3"><rect x="388" y="220" height="20" width="0"><animate attributeName="width" values="0;0;480;480" keyTimes="0;0.27;0.32;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c4"><rect x="388" y="242" height="20" width="0"><animate attributeName="width" values="0;0;480;480" keyTimes="0;0.39;0.44;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <style>
    .mono { font: 13px 'Courier New', monospace; fill:#c9d1d9; }
    .ok { fill:#3ddc84; }
    .cy { fill:#22d3ee; }
    .title { font: 900 78px 'Segoe UI', Arial, sans-serif; letter-spacing: 12px; }
    .sub { font: 600 17px 'Segoe UI', Arial, sans-serif; fill:#7d8da1; letter-spacing: 2px; }
    .g1 { animation: glitchA 4s infinite; }
    .g2 { animation: glitchB 4s infinite; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes glitchA { 0%,88%,100% { transform:translate(0,0);} 90% { transform:translate(-5px,1px);} 93% { transform:translate(4px,-2px);} 96% { transform:translate(-3px,1px);} }
    @keyframes glitchB { 0%,88%,100% { transform:translate(0,0);} 91% { transform:translate(5px,-1px);} 94% { transform:translate(-4px,2px);} 97% { transform:translate(3px,0);} }
    @keyframes blink { 0%,50% { opacity:1;} 50.1%,100% { opacity:0;} }
  </style>



  <!-- orbit system -->
  <g transform="translate(180 160)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
      <g transform="rotate(-25)">
        <ellipse rx="125" ry="40" fill="none" stroke="#3ddc84" stroke-opacity=".35" stroke-dasharray="3 6"/>
        <circle r="6" fill="#3ddc84" filter="url(#glow)"><animateMotion dur="6s" repeatCount="indefinite" path="M-125 0 a125 40 0 1 0 250 0 a125 40 0 1 0 -250 0"/></circle>
      </g>
      <g transform="rotate(40)">
        <ellipse rx="110" ry="34" fill="none" stroke="#22d3ee" stroke-opacity=".35" stroke-dasharray="3 6"/>
        <circle r="5" fill="#22d3ee" filter="url(#glow)"><animateMotion dur="8s" repeatCount="indefinite" path="M-110 0 a110 34 0 1 1 220 0 a110 34 0 1 1 -220 0"/></circle>
      </g>
      <g transform="rotate(100)">
        <ellipse rx="115" ry="30" fill="none" stroke="#a78bfa" stroke-opacity=".35" stroke-dasharray="3 6"/>
        <circle r="4.5" fill="#a78bfa" filter="url(#glow)"><animateMotion dur="10s" repeatCount="indefinite" path="M-115 0 a115 30 0 1 0 230 0 a115 30 0 1 0 -230 0"/></circle>
      </g>
    </g>
    <!-- core -->
    <g filter="url(#glow)">
      <polygon points="46,0 23,39.8 -23,39.8 -46,0 -23,-39.8 23,-39.8" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-opacity=".7">
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="12s" repeatCount="indefinite"/>
      </polygon>
      <g>
        <animateTransform attributeName="transform" type="scale" values="1;1.1;1" dur="2.4s" repeatCount="indefinite"/>
        <polygon points="34,0 17,29.4 -17,29.4 -34,0 -17,-29.4 17,-29.4" fill="#0a0f16" stroke="#3ddc84" stroke-width="3"/>
        <polygon points="20,0 10,17.3 -10,17.3 -20,0 -10,-17.3 10,-17.3" fill="#3ddc84" fill-opacity=".2"/>
      </g>
    </g>
    <text x="0" y="4" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#22d3ee">6899</text>
  </g>

  <!-- title with glitch -->
  <g>
    <text class="title g1" x="370" y="105" fill="#ff2d95" opacity=".6" style="mix-blend-mode:screen">RODIN</text>
    <text class="title g2" x="370" y="105" fill="#22d3ee" opacity=".6" style="mix-blend-mode:screen">RODIN</text>
    <text class="title" x="370" y="105" fill="url(#ttl)" filter="url(#glow)">RODIN</text>
  </g>
  <text class="sub" x="374" y="138">POCO X7 PRO  ·  REDMI TURBO 4</text>

  <!-- terminal -->
  <rect x="370" y="152" width="510" height="140" rx="10" fill="#070b12" fill-opacity=".85" stroke="#1f3347"/>
  <circle cx="388" cy="166" r="4" fill="#ff5f56"/>
  <circle cx="403" cy="166" r="4" fill="#ffbd2e"/>
  <circle cx="418" cy="166" r="4" fill="#27c93f"/>

  <g clip-path="url(#c1)"><text class="mono" x="390" y="191"><tspan class="cy">$</tspan> lunch rodin-userdebug</text></g>
  <g clip-path="url(#c2)"><text class="mono" x="390" y="213">[ <tspan class="ok">OK</tspan> ] MT6899 kernel loaded</text></g>
  <g clip-path="url(#c3)"><text class="mono" x="390" y="235">[ <tspan class="ok">OK</tspan> ] vendor blobs extracted</text></g>
  <g clip-path="url(#c4)"><text class="mono" x="390" y="257">[ <tspan class="ok">OK</tspan> ] sepolicy merged</text></g>

  <!-- progress bar -->
  <rect x="390" y="268" width="380" height="8" rx="4" fill="#12202e"/>
  <rect x="390" y="268" height="8" rx="4" fill="url(#ttl)" width="0">
    <animate attributeName="width" values="0;0;380;380" keyTimes="0;0.5;0.8;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text class="mono ok" x="780" y="276" opacity="0">
    building...
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.55;1" dur="12s" repeatCount="indefinite"/>
  </text>
</svg>
